/* ---------- PAGINA PRINCIPALĂ ---------- */
function acasa(){
return'<h1>Oportunitatea momentului</h1><p class="sub">Intermedierea asigurărilor, pas cu pas. Seminar non-life.</p>'+
'<h2>De ce facem prin specialist?</h2><div class="g"><div class="c dk"><div class="big">10–30%</div><p>din proces îl faci tu</p></div><div class="c dk"><div class="big">70%</div><p>din comision îl primești</p></div><div class="c dk"><div class="big">100%</div><p>din unități le primești, oricum</p></div></div><p class="note">În același timp pe care l-ai aloca oricum, poți face de 2 ori mai mulți bani.</p>'+
'<h2>Cum ajută specialistul</h2><p class="sub">Tu aduci clientul, eu mă ocup de restul.</p>'+cards([["Timp câștigat","Faci doar 10–30% din proces. Timpul rămas îl investești în contacte noi și în clienții tăi."],["Know-how","Nu trebuie să cunoști condițiile fiecărui produs sau ce se recomandă. Preiau eu procesul."],["Nu ești singur","Dacă apare o eroare, nu cauți pe cont propriu o platformă sau un contact la asigurător."],["Cross-sell","Vorbesc direct cu clientul și pot propune RCA sau alte servicii. Efortul tău e zero, tu primești unități și comision."]])+
'<h2>De ce intermediem serviciile?</h2><p class="sub">Sunt foarte utile pentru oameni și aduc mai multe polițe la același client. Sursa: Allianz Capital Markets Day 2024.</p><div class="g"><div class="c so"><h3>Cross-sell</h3><p>Cu cât are mai multe servicii, cu atât cumpără mai ușor altele.</p></div><div class="c dk"><h3>Grad de retenție</h3><p>Mai multe polițe înseamnă mai puține renunțări.</p></div></div>'+
'<div class="tw"><table><tr><th>Contracte</th><th>Șansa de a cumpăra încă o poliță</th><th>Rata de renunțare</th></tr><tr><td>1</td><td>3%</td><td>11%</td></tr><tr><td>2</td><td>7%</td><td>4%</td></tr><tr><td>3</td><td>9%</td><td>2%</td></tr><tr><td>6+</td><td>peste 13%</td><td>0,5%</td></tr></table></div>'+
'<h2>Venituri</h2><div class="g"><div class="c"><div class="big">8.000 lei / an</div><p>La un portofoliu de 100 de clienți: facultativă + RCA, 80 lei × 100 clienți. De ce am lăsa bani pe masă?</p></div><div class="c"><div class="big">1.160 UN / an</div><p>4 analize pe săptămână: 192 de analize ținute → 58 × 20 UN. Aprox. 10% din totalul anual.</p></div><div class="c"><div class="big">+10% UN</div><p>Cota de calitate: UN care nu dispar. Plata se face anual, fără întârzieri. La 100 de clienți: 2.000 UN în plus într-un an. O lună în plus muncită = al 13-lea salariu.</p></div></div>'+
'<h2>Tips &amp; tricks: service</h2>'+cards([["Raport de cont","Cost average și alte date, incluse în discuție. + contract non-OVB."],["Obiective","Ce vrea clientul să atingă și cum îl ajuți."],["Asigurări de sănătate","Îi explici cum funcționează, pe înțelesul lui."],["Asigurări","Educație prin asigurări: le explici ce acoperă și de ce contează."]])+
'<h2>Servicii intermediate</h2><div class="g">'+[["RCA + decontare directă","Asigurarea auto obligatorie. Cu decontarea directă te despăgubește propriul asigurător, fără întârzieri."],["Casco","Asigurare pentru mașina ta, indiferent cine e vinovat. Acoperă reparațiile după accident, furt sau grindină."],["Asistență rutieră","Ajutor dacă mașina rămâne blocată: depanare și tractare, fără costuri neprevăzute."],["Facultativă și PAD","PAD e obligatorie pentru locuință; facultativa o completează: dezastre, incendiu, furt și alte riscuri."],["Răspundere civilă","Pentru daune produse involuntar pacienților. Medicul e protejat financiar; se face ușor și rapid."],["Asigurare animale","Costuri veterinare și daune produse altora, fără surprize."],["Travel","Cheltuieli medicale, repatriere și bagaje, departe de casă."]].map(function(x){return'<div class="c"><h3>'+x[0]+"</h3><p>"+x[1]+"</p></div>"}).join("")+'</div>'+
'<h2>7 lucruri de știut când intermediezi</h2><div class="c"><ol><li>RCA nu se face din aceeași zi: foarte puțini asigurători acceptă.</li><li>Asistența rutieră pornește în 10 zile; clientul ar trebui s-o facă cât mai repede.</li><li>Facem tot timpul pe proprietar.</li><li>Din când în când, RCA poate ieși mai ieftin în alte părți.</li><li>Nu lucrăm cu toată lumea: uneori e mai ieftin în altă parte, alteori mai scump.</li><li>PJ instant: Casco, RCA și asistență rutieră. Restul e personalizat și durează.</li><li>PF: putem face totul instant.</li></ol></div>'+
'<h2>Procedura</h2><p class="sub">Alegi tu varianta potrivită. Detaliile sunt în tabul Proceduri.</p><div class="cols"><div class="c"><span class="pill">Varianta A</span><p>Trimiți clientului template-ul pentru asigurarea dorită, apoi mesaj la specialist.</p></div><div class="c"><span class="pill">Varianta B</span><p>Doar date client + GDPR, apoi mesaj la specialist: mă ocup eu full de client.</p></div></div><p class="note">Pași comuni: client interesat (vrea o asigurare sau o are deja), apoi GDPR făcut și date client completate în Easy. Cu template-urile pregătite din timp, eficientizăm mult procesul.</p>'+
'<h2>Exercițiu</h2><div class="cols"><div class="c so"><h3>5 minute · My Home</h3><p>Gândește-te la 5 persoane care ar avea nevoie de o asigurare de locuință.</p></div><div class="c so"><h3>Câteva minute · RCA</h3><p>Același exercițiu pentru RCA: cine ar putea beneficia?</p></div></div>'+
'<div class="c dk" style="margin-top:36px"><h3>Contact</h3><p style="font-size:20px;color:#fff">Walter Benedek · 0729 839 908</p></div>'}

/* ---------- PROCEDURI ---------- */
var TPL=[
["Poliță travel","Pentru oferta de asigurare travel, am nevoie de:\n1. Destinația\n2. Călătorești singur sau mai adăugăm pe cineva pe poliță?\n3. În ce perioadă călătorești? (data plecării și data întoarcerii)\n4. Dacă mergi cu mașina: vrei și asistență rutieră?\n5. Dacă mergi cu avionul: vrei asigurare pentru bagaje?\n6. Vrei acoperire pentru întârziere sau anulare de zbor?\n7. Vrei asigurare suplimentară pentru sporturi extreme?\n8. Suma asigurată: 30.000 sau 50.000 EUR?\n9. Dacă este vorba de o persoană însărcinată, te rog să menționezi acest lucru: sarcina trebuie anunțată la încheierea poliței."],
["Poliță RCA","Pentru oferta de RCA, am nevoie de:\n1. Mașina este înmatriculată sau în curs de înmatriculare?\n2. De când ai nevoie de poliță? (dacă nu știi data de expirare, o verificăm noi)\n3. Talonul mașinii (dacă ai doar CIV, trimite-mi și numărul de înmatriculare)\n4. Foarte important: folosești mașina pentru activități de ridesharing sau taxi?","Reține: asistența rutieră pornește în 10 zile, deci merită făcută din timp."],
["Asistență rutieră","Pentru oferta de asistență rutieră, am nevoie de:\n1. Talonul mașinii"],
["Casco","Pentru oferta Casco, am nevoie de aceleași date ca la RCA (mai sus) și, în plus, de:\n1. Numărul de kilometri\n2. Numărul de chei\n3. Vrei Casco care să asigure orice caz, sau vedem și variante în care vandalismul ori furtul sunt excluse? (așa putem reduce costul)\n4. Plata o preferi trimestrial, semestrial sau anual?"],
["Poliță PAD + facultativă","Pentru oferta de asigurare a locuinței (PAD + facultativă), am nevoie de:\n1. Adresa completă a locuinței (inclusiv cod poștal)\n2. Tipul locuinței (apartament / casă)\n3. Anul construcției\n4. Materialul de construcție (beton, cărămidă, lemn etc.)\n5. Suprafața utilă (mp)\n6. Numărul de camere\n7. Dacă este apartament: etajul la care se află și numărul de etaje ale blocului. Dacă este casă: numărul de etaje\n8. Nivelul finisajelor (low / mediu / high / lux)\n9. Locuința este folosită permanent sau ocazional?\n10. Există un credit ipotecar pe locuință? (dacă da, polița trebuie cesionată către bancă)\n11. Valoarea la care vrei să fie asigurată locuința\n12. Vrei să fie asigurate și bunurile din interior (mobilier, electrocasnice etc.)? Dacă da, aproximativ la ce valoare?\n13. Există anexe care vrei să fie asigurate?"]];
function proceduri(){
return'<h1>Proceduri</h1><p class="sub">Proceduri și template-uri gata de trimis.</p>'+
'<h2>Cum colaborăm</h2><p class="sub">Alegi tu varianta potrivită pentru fiecare client.</p><div class="cols"><div class="c"><span class="pill">1 · Vorbim prin voi cu clientul</span><ol><li>Parcurgeți pașii din procedură conform situației.</li><li>Îmi trimiteți un mesaj, ca să trimit eu DNT-ul.</li><li>Între timp puteți trimite clientului template-ul potrivit conform asigurării dorite.</li></ol></div><div class="c"><span class="pill">2 · Vorbesc eu cu clientul</span><ol><li>Mă alocați în Easy.</li><li>Îmi trimiteți un mesaj referitor la discuția deschisă cu clientul (vrea RCA, facultativă etc.).</li></ol></div></div>'+
'<h2>Procedura</h2><div class="cols"><div class="c"><h3>Pentru a intermedia o asigurare</h3><ol><li>GDPR + date clienți.</li><li>Mă selectați la specialist non-life (se află pe mijloc, la date clienți).</li></ol></div><div class="c"><h3>Polițe viitoare (clienți din analiză)</h3><ol><li>GDPR.</li><li>Mă alocați ca specialist.</li><li>Intrați la contract non-OVB, selectați tipul asigurării pe care o are deja și puneți perioada de valabilitate.</li></ol></div><div class="c"><h3>Clienți existenți care vor pe viitor</h3><ol><li>Mă alocați ca specialist.</li><li>Intrați la contract non-OVB, selectați tipul asigurării pe care o are deja și puneți perioada de valabilitate.</li></ol></div></div>'+
'<div class="note"><span class="red">Dacă nu știi data la RCA</span>, verifică pe <a class="blue" href="https://aida.info.ro/polite-rca" target="_blank" rel="noopener">aida.info.ro/polite-rca</a> după numărul de înmatriculare, iar dacă nu găsești, după seria de șasiu.</div><div class="c dk" style="margin-top:12px"><h3>Foarte important</h3><p>DNT-ul trebuie să îl trimit eu. Chiar dacă l-ați trimis voi, va trebui să îl trimit și eu încă o dată. Trebuie să fiu alocat ca specialist: așa primesc notificare înainte să expire asigurarea și pot contacta clientul.</p></div>'+
'<h2>Template-uri</h2><p class="sub">Copiază textul și trimite-l direct clientului.</p>'+
[1,2,4,3,0].map(function(i){var t=TPL[i];return'<div class="c" style="margin-top:12px"><h3>'+t[0]+'</h3><div class="tpl" id="t'+i+'">'+t[1]+'</div>'+(t[2]?'<p class="note">'+t[2]+'</p>':'')+'<button data-i="'+i+'">Copiază textul</button></div>'}).join("")}

/* ---------- CAB ---------- */
var CAB=[
["Facultativa locuinței + PAD","Casa protejată complet, nu pe jumătate",
["PAD este obligatorie prin lege și acoperă cutremur, inundații și alunecări de teren.","Facultativa acoperă ce nu acoperă PAD: incendiu, furt, explozie, furtună, grindină, țevi sparte, vandalism.","Poate include și conținutul locuinței (mobilă, electrocasnice), nu doar structura."],
["Cu PAD ești în regulă cu legea și eviți amenda.","Facultativa completează PAD-ul, deci acoperirea e completă, nu pe jumătate.","Dacă o țeavă crapă sau cineva intră în casă, ai de unde să repari, nu din economii."],
["Dormi liniștit, știind că munca de o viață nu dispare într-o noapte.","Nu ești nevoit să iei un credit sau să ceri bani de la familie.","Ai protejat locul în care locuiește familia ta."],
"PAD-ul te acoperă la cutremur și inundație. Dar la o țeavă spartă sau la un furt, cine plătește?"],
["RCA + decontare directă","Legal în trafic și cu viața mai simplă după un accident",
["RCA este obligatorie și acoperă daunele pe care le produci altora în trafic.","Decontarea directă: când nu ești vinovat, dauna ta o gestionează propriul asigurător.","Se aplică în accidente simple, cu pagube materiale, în condițiile din reglementări."],
["Rămâi la un singur interlocutor, firma pe care ai ales-o tu.","Procesul e mai rapid și mai puțin birocratic.","Eviți discuțiile și neînțelegerile cu cealaltă companie de asigurări."],
["Pierzi mai puțin timp și ai mai puține nervi după un accident.","Mașina ajunge mai repede la reparat și revii la rutina ta.","Ai un om și o firmă la care suni direct, iar eu pot fi omul tău de legătură."],
"Dacă nu ești vinovat, nu mai alergi după firma celuilalt. Vorbești doar cu asigurătorul tău."],
["Casco","Mașina ta, protejată chiar și când greșești tu",

["RCA plătește doar dacă ești nevinovat. Casco plătește și când greșești tu.","Primești despăgubire și dacă vinovatul fuge sau nu are RCA.","Poți alege reparația în service autorizat, nu doar o sumă de bani."],

"RCA plătește doar dacă ai dreptate. Dar dacă greșești tu sau vinovatul fuge, cine îți repară mașina?"],
["Asistență rutieră","Un telefon și problema ta devine problema lor",
["Servicii în caz de pană, accident, baterie descărcată sau mașină blocată: tractare, mecanic la fața locului.","Poate include mașină la schimb, cazare sau transport dacă rămâi blocat.","Disponibilă non-stop, în România și, în anumite pachete, și în străinătate."],
["Ai un singur număr de telefon, nu mai cauți un tractor la 2 noaptea.","Costul tractării și al intervenției e inclus, deci nu negociezi pe loc.","Funcționează la fel pe autostradă, în oraș sau în vacanță."],
["Nu rămâi blocat și vulnerabil cu familia sau copiii în mașină.","Economisești timp, bani și stres exact când ai deja o problemă.","Călătorești mai relaxat, mai ales pe distanțe lungi."],
"Ce faci dacă rămâi cu mașina în pană la 2 noaptea, cu copiii în spate?"],

"Pentru oferta de asigurare":"Az utazási biztosítás ajánlatához a következőkre van szükségem:\n1. Úti cél\n2. Egyedül utazol, vagy felvegyünk valaki mást is a kötvényre?\n3. Mikor utazol? (indulás és visszaérkezés dátuma)\n4. Ha autóval mész: szeretnél útsegélyt is?\n5. Ha repülővel mész: szeretnél poggyászbiztosítást?\n6. Szeretnél fedezetet a járat késésére vagy törlésére?\n7. Szeretnél kiegészítő biztosítást extrém sportokra?\n8. Biztosítási összeg: 30 000 vagy 50 000 EUR?\n9. Ha várandós személyről van szó, kérlek, jelezd: a terhességet a kötvény megkötésekor be kell jelenteni.",
"Pentru oferta de RCA,":"Az RCA ajánlathoz a következőkre van szükségem:\n1. Az autó forgalomba van helyezve, vagy forgalomba helyezés alatt áll?\n2. Mikortól kell a kötvény? (ha nem tudod a lejárati dátumot, mi ellenőrizzük)\n3. Az autó forgalmi engedélye (ha csak CIV-d van, küldd el a rendszámot is)\n4. Nagyon fontos: használod az autót ridesharing vagy taxi tevékenységre?",

"Pentru oferta Casco, am":"A Casco ajánlathoz ugyanazokra az adatokra van szükségem, mint az RCA-hoz (fent), és ezen felül:\n1. Futott kilométerek száma\n2. Kulcsok száma\n3. Olyan Casco-t szeretnél, amely minden esetet fedez, vagy megnézzük azokat a változatokat is, ahol a vandalizmus vagy a lopás ki van zárva? (így csökkenthető a költség)\n4. A díjat negyedévente, félévente vagy évente fizetnéd?",
"Pentru oferta de asigurarea":"A lakásbiztosítás (PAD + fakultatív) ajánlatához a következőkre van szükségem:\n1. A lakás teljes címe (irányítószámmal)\n2. A lakás típusa (lakás / ház)\n3. Építés éve\n4. Építőanyag (beton, tégla, fa stb.)\n5. Hasznos alapterület (nm)\n6. Szobák száma\n7. Ha lakás: melyik emeleten van, és hány emeletes az épület. Ha ház: az emeletek száma\n8. Felszereltség szintje (alacsony / közepes / magas / luxus)\n9. A lakást állandóan vagy alkalmanként használják?\n10. Van jelzáloghitel a lakáson? (ha igen, a kötvényt engedményezni kell a banknak)\n11. Milyen értékre szeretnéd biztosítani a lakást?\n12. Szeretnéd a belső tárgyakat is biztosítani (bútor, háztartási gépek stb.)? Ha igen, kb. milyen értékben?\n13. Vannak melléképületek, amelyeket biztosítani szeretnél?",
